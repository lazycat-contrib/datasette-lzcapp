application:
  subdomain: datasette
  multi_instance: false
  # datasette has no user accounts or login page by default (anonymous access
  # to all loaded databases); exposing it via public_path would let anyone
  # with the URL read the data, so the platform entry gate stays the only
  # auth layer (tileserver-gl/goshs precedent).
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://datasette:8080/
services:
  datasette:
    # upstream: datasetteproject/datasette:0.65.5
    image: docker.1ms.run/datasetteproject/datasette:0.65.5
    command: ["serve", "/data", "--host", "0.0.0.0", "--port", "8080", "--cors"]
    binds:
      - /lzcapp/var/data:/data
usage: |
  Datasette 是一个 SQLite 数据发布与浏览工具：把 .db / .sqlite / .sqlite3
  数据库文件放进应用数据目录 /lzcapp/var/data，打开应用即可浏览所有表、
  执行只读 SQL 查询，并获得每个库的 JSON API（-r0.65.5 会自动加载目录内
  全部数据库文件）。

  使用方法：
  1. 把 SQLite 数据库文件放进应用数据目录 /lzcapp/var/data。
  2. 打开应用即可看到数据库列表，点进表可浏览、筛选、导出 CSV/JSON。
  3. 查询页面支持任意只读 SQL；API 端点形如 /<库名>/<表名>.json。

  数据与安全：
  - 应用默认没有账号体系（匿名可读所有已加载数据），本包不对外开放
    未登录访问（保持平台入口鉴权）。请不要把敏感数据库放进来。
  - 服务器默认监听 8080 端口（容器内），数据目录为只读挂载即可工作。

  说明：
  - 本包未做实机验证，功能以官方文档为准，遇到问题请反馈。
